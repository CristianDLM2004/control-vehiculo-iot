<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e1e1e">
<title>Control IoT · Excavadora</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<header class="app-header"><h1 class="h6 m-0">Central de control · <span id="vehName">Cargando…</span></h1></header>
<main class="container-lg py-3">
  <section class="status" aria-label="Estado de las conexiones">
    <div id="st-ws" class="chip unk"><i class="bi"></i><span><small><span class="full">WebSocket WSS</span><span class="short">WebSocket</span></small><b class="txt">…</b></span></div>
    <div id="st-api" class="chip unk"><i class="bi"></i><span><small><span class="full">Servidor AWS · API de 21 servicios</span><span class="short">API AWS · 21</span></small><b class="txt">…</b></span></div>
    <div id="st-db" class="chip unk"><i class="bi"></i><span><small><span class="full">Base de datos · Amazon RDS</span><span class="short">Amazon RDS</span></small><b class="txt">…</b></span></div>
  </section>
  <section class="remote" aria-label="Control remoto">
    <button id="btnStop" class="btn-act stop" data-cmd="DETENER"><i class="bi bi-stop-fill"></i><span>Detener</span></button>
    <div id="joyL" class="joy"></div>
    <div id="joyR" class="joy"></div>
    <div class="mid">
      <div class="actions" aria-label="Luz y sonido">
        <button id="btnLight" class="btn-act" data-cmd="LUZ"><i class="bi bi-lightbulb-fill"></i><span>Luces</span></button>
        <button id="btnSound" class="btn-act" data-cmd="SONIDO"><i class="bi bi-volume-up-fill"></i><span>Sonido</span></button>
      </div>
      <div class="demo" aria-label="Selector y ejecución de DEMO">
        <div id="dialTip" class="dial-tip" role="status" aria-live="polite"></div>
        <div class="dial-wrap">
          <button id="dialPrev" class="dial-step" aria-label="DEMO anterior"><i class="bi bi-chevron-left"></i></button>
          <div id="dial" class="dial" role="spinbutton" tabindex="0" aria-label="Seleccionar DEMO: rueda del ratón, arrastrar o flechas" aria-valuemin="1" aria-valuenow="0">
            <div id="dialRing" class="dial-ring"></div><span id="dialNum" class="dial-num">–</span>
          </div>
          <button id="dialNext" class="dial-step" aria-label="DEMO siguiente"><i class="bi bi-chevron-right"></i></button>
        </div>
        <div class="demo-btns">
          <button id="demoRun" class="btn btn-success" aria-label="Ejecutar DEMO" title="Ejecutar DEMO"><i class="bi bi-play-fill"></i></button>
          <button id="demoCancel" class="btn btn-outline-danger" aria-label="Cancelar DEMO" title="Cancelar DEMO" disabled><i class="bi bi-stop-fill"></i></button>
        </div>
      </div>
    </div>
    <div class="led-wrap"><span class="led-lbl">DEMO</span><div id="ledBar" class="led-bar" role="progressbar" aria-label="Progreso de la DEMO" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div></div>
    <p id="msg" class="msg" role="status" aria-live="polite">Listo.</p>
  </section>
</main>
<footer class="credits"><small id="credits"></small></footer>
<script type="module" src="js/main.js"></script>
</body>
</html>
